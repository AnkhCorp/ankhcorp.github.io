baseURL = '/'
title = 'AnkhCorp'
enableGitInfo = true

defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    locale = 'en-us'
    label = 'EN'
    weight = 1
  [languages.pt]
    locale = 'pt-br'
    label = 'PT'
    weight = 2

[params]
  onion = 'http://opnpnk6eutjiqy4ndpyvwxd5pncj2g2cmz6fkocr5uh3omnn4utvspad.onion'
  sourcerepo = 'https://github.com/CPunch/openpunk'

[markup]
  [markup.highlight]
    anchorLineNos = true
    codeFences = true
    guessSyntax = true
    hl_Lines = ''
    noClasses = true
    style = 'monokai'
    tabWidth = 4

[markup.goldmark.renderer]
  unsafe = true

[imaging]
  quality = 50

[[languages.en.menu.main]]
  name = "Home"
  url = "/"
  weight = 1
[[languages.en.menu.main]]
  name = "Journal"
  url = "/journal/"
  weight = 2
[[languages.en.menu.main]]
  name = "Tags"
  url = "/tags"
  weight = 3

[[languages.pt.menu.main]]
  name = "Início"
  url = "/"
  weight = 1
[[languages.pt.menu.main]]
  name = "Diário"
  url = "/journal/"
  weight = 2
[[languages.pt.menu.main]]
  name = "Tags"
  url = "/tags"
  weight = 3
